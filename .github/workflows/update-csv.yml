name: Update KPI CSV

on:
  repository_dispatch:
    types: [kpi-update]

jobs:
  update-csv:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write CSV from payload
        run: echo "${{ github.event.client_payload.content }}" | base64 -d > DealerTrackKPIs.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DealerTrackKPIs.csv
          git diff --staged --quiet || git commit -m "Auto-update KPI CSV"
          git push
